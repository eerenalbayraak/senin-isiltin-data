name: Katalog yenile

on:
  schedule:
    # Türkiye saatiyle 08:00, 13:00 ve 19:00 (UTC+3)
    - cron: '0 5,10,16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siteden katalog üret
        env:
          CATALOG_OUT: ${{ github.workspace }}/catalog.new.json
        run: node tool/build_demo_catalog.mjs

      - name: Değiştiyse yayınla
        run: |
          changed=$(node -e '
            const fs = require("fs");
            const strip = (f) => { const c = JSON.parse(fs.readFileSync(f, "utf8")); delete c.generatedAt; return JSON.stringify(c); };
            console.log(strip("catalog.json") === strip("catalog.new.json") ? "no" : "yes");
          ')
          if [ "$changed" = "no" ]; then
            echo "Sitede değişiklik yok."
            rm catalog.new.json
            exit 0
          fi
          mv catalog.new.json catalog.json
          git config user.name "katalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Katalog güncellendi ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
